name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        shell: bash
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: blockcity-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
